name: Python CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Configurar Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      # 3️⃣ Instalar Poetry
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.0

      # 4️⃣ Instalar dependencias (producción + desarrollo)
      - name: Install dependencies
        run: poetry install

      # 5️⃣ Ejecutar pre-commit hooks (Black, isort, Flake8, MyPy)
      - name: Run pre-commit hooks
        run: poetry run pre-commit run --all-files

      # 6️⃣ Ejecutar tests con pytest
      - name: Run tests
        run: poetry run pytest -v
